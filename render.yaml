services:
  - type: web
    name: wild-within
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: SECRET_KEY
        generateValue: true
